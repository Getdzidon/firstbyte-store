<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | FirstByte</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/pages.css">
</head>
<body>
    <header id="mainHeader">
        <a href="index.html" class="logo-link">
            <img src="images/FirstByte Logo1.png" alt="FirstByte Logo" class="logo-img">
        </a>
        <nav>
            <ul>
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#products">Shop</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
        </div>
    </header>

    <div class="not-found">
        <div class="not-found-code">404</div>
        <h2>Page Not Found</h2>
        <p>Oops! The page you're looking for doesn't exist or has been moved.</p>
        <div class="not-found-actions">
            <a href="index.html" class="btn">Go Home</a>
            <a href="index.html#products" class="btn-outline">Browse Products</a>
        </div>
    </div>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 FirstByte Marketplace. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
</body>
</html>
